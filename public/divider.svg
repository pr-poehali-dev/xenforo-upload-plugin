<svg xmlns="http://www.w3.org/2000/svg" width="800" height="70" viewBox="0 0 800 70">
  <!-- Left double lines with gradient -->
  <defs>
    <linearGradient id="lineLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9956c;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#c9956c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c9956c;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lineRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9956c;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#c9956c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c9956c;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="lineLeftThin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8b98a;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#e8b98a;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#e8b98a;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="lineRightThin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8b98a;stop-opacity:0.6"/>
      <stop offset="70%" style="stop-color:#e8b98a;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#e8b98a;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Left thick line -->
  <line x1="0" y1="32" x2="368" y2="32" stroke="url(#lineLeft)" stroke-width="2.5"/>
  <!-- Left thin line -->
  <line x1="0" y1="37" x2="368" y2="37" stroke="url(#lineLeftThin)" stroke-width="1"/>

  <!-- Right thick line -->
  <line x1="432" y1="32" x2="800" y2="32" stroke="url(#lineRight)" stroke-width="2.5"/>
  <!-- Right thin line -->
  <line x1="432" y1="37" x2="800" y2="37" stroke="url(#lineRightThin)" stroke-width="1"/>

  <!-- Герб РФ двуглавый орёл -->
  <g transform="translate(400,34) scale(1.15)" fill="none" stroke="#c9956c" stroke-linejoin="round" stroke-linecap="round">

    <!-- Тело орла -->
    <ellipse cx="0" cy="8" rx="11" ry="13" stroke-width="1.3" fill="#c9956c" fill-opacity="0.12"/>

    <!-- Щит на груди -->
    <path d="M-6,3 L-6,14 Q0,20 6,14 L6,3 Q0,-1 -6,3 Z" stroke-width="1.2" fill="#c9956c" fill-opacity="0.2"/>
    <!-- Всадник (Георгий Победоносец) -->
    <ellipse cx="0" cy="7" rx="2.5" ry="3" stroke-width="0.8"/>
    <line x1="0" y1="10" x2="0" y2="14" stroke-width="1"/>
    <line x1="-3" y1="11" x2="3" y2="11" stroke-width="0.8"/>

    <!-- Левая шея -->
    <path d="M-5,-5 C-9,-10 -15,-9 -14,-4 C-13,0 -8,0 -5,-5 Z" stroke-width="1.2" fill="#c9956c" fill-opacity="0.12"/>
    <!-- Левая голова -->
    <circle cx="-15" cy="-10" r="6" stroke-width="1.3" fill="#c9956c" fill-opacity="0.12"/>
    <!-- Левый клюв -->
    <path d="M-20,-8 L-24,-10 L-20,-12" stroke-width="1.2"/>
    <!-- Левая корона -->
    <path d="M-19,-16 L-17,-21 L-15,-17 L-13,-21 L-11,-16" stroke-width="1.3"/>
    <path d="M-20,-16 Q-15,-14 -10,-16" stroke-width="1"/>
    <!-- Левый глаз -->
    <circle cx="-16" cy="-11" r="1.2" fill="#c9956c" stroke-width="0.5"/>

    <!-- Правая шея -->
    <path d="M5,-5 C9,-10 15,-9 14,-4 C13,0 8,0 5,-5 Z" stroke-width="1.2" fill="#c9956c" fill-opacity="0.12"/>
    <!-- Правая голова -->
    <circle cx="15" cy="-10" r="6" stroke-width="1.3" fill="#c9956c" fill-opacity="0.12"/>
    <!-- Правый клюв -->
    <path d="M20,-8 L24,-10 L20,-12" stroke-width="1.2"/>
    <!-- Правая корона -->
    <path d="M11,-16 L13,-21 L15,-17 L17,-21 L19,-16" stroke-width="1.3"/>
    <path d="M10,-16 Q15,-14 20,-16" stroke-width="1"/>
    <!-- Правый глаз -->
    <circle cx="16" cy="-11" r="1.2" fill="#c9956c" stroke-width="0.5"/>

    <!-- Центральная большая корона -->
    <path d="M-5,-14 L-3,-20 L0,-16 L3,-20 L5,-14" stroke-width="1.5"/>
    <path d="M-6,-14 Q0,-11 6,-14" stroke-width="1.2"/>
    <circle cx="0" cy="-20" r="1.5" fill="#c9956c" stroke-width="0.5"/>

    <!-- Левое крыло -->
    <path d="M-10,-1 C-20,-6 -28,-2 -26,8 C-24,16 -16,17 -10,10" stroke-width="1.4" fill="#c9956c" fill-opacity="0.08"/>
    <path d="M-11,2 C-19,-1 -24,4 -23,11" stroke-width="1"/>
    <path d="M-11,5 C-18,3 -22,8 -21,13" stroke-width="1"/>
    <!-- Перья левого крыла -->
    <path d="M-26,3 L-31,0" stroke-width="1.2"/>
    <path d="M-27,7 L-32,7" stroke-width="1.2"/>
    <path d="M-26,11 L-31,14" stroke-width="1.2"/>
    <path d="M-23,14 L-27,18" stroke-width="1.2"/>

    <!-- Правое крыло -->
    <path d="M10,-1 C20,-6 28,-2 26,8 C24,16 16,17 10,10" stroke-width="1.4" fill="#c9956c" fill-opacity="0.08"/>
    <path d="M11,2 C19,-1 24,4 23,11" stroke-width="1"/>
    <path d="M11,5 C18,3 22,8 21,13" stroke-width="1"/>
    <!-- Перья правого крыла -->
    <path d="M26,3 L31,0" stroke-width="1.2"/>
    <path d="M27,7 L32,7" stroke-width="1.2"/>
    <path d="M26,11 L31,14" stroke-width="1.2"/>
    <path d="M23,14 L27,18" stroke-width="1.2"/>

    <!-- Хвост -->
    <path d="M-7,19 Q0,17 7,19" stroke-width="1.2"/>
    <path d="M-8,19 L-10,28" stroke-width="1.2"/>
    <path d="M-4,20 L-5,29" stroke-width="1.2"/>
    <path d="M0,21 L0,30" stroke-width="1.2"/>
    <path d="M4,20 L5,29" stroke-width="1.2"/>
    <path d="M8,19 L10,28" stroke-width="1.2"/>

    <!-- Левая лапа -->
    <path d="M-5,19 C-8,23 -10,26 -9,29" stroke-width="1.2"/>
    <path d="M-9,29 L-13,32 M-9,29 L-9,33 M-9,29 L-5,32" stroke-width="1"/>

    <!-- Правая лапа -->
    <path d="M5,19 C8,23 10,26 9,29" stroke-width="1.2"/>
    <path d="M9,29 L13,32 M9,29 L9,33 M9,29 L5,32" stroke-width="1"/>

    <!-- Скипетр (левая лапа) -->
    <line x1="-13" y1="26" x2="-13" y2="16" stroke-width="1.3"/>
    <path d="M-15.5,16 L-13,12 L-10.5,16" stroke-width="1.2"/>
    <circle cx="-13" cy="14" r="2" stroke-width="1"/>

    <!-- Держава (правая лапа) -->
    <circle cx="13" cy="23" r="4.5" stroke-width="1.3" fill="#c9956c" fill-opacity="0.1"/>
    <line x1="13" y1="18.5" x2="13" y2="16" stroke-width="1.2"/>
    <path d="M9,23 Q13,20.5 17,23" stroke-width="1"/>
    <line x1="13" y1="18.5" x2="13" y2="27.5" stroke-width="0.8"/>

  </g>
</svg>
